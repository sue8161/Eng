function speak(s){if(!('speechSynthesis' in window)){alert('이 브라우저는 음성 재생을 지원하지 않아요. Chrome 또는 Safari를 이용해 주세요.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=$('accent').value;u.rate=Number($('rate').value);let vs=speechSynthesis.getVoices();let v=vs.find(v=>v.lang==u.lang&&/Google|Samantha|Microsoft|Daniel|Karen/i.test(v.name))||vs.find(v=>v.lang===u.lang)||vs.find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function save(id){fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('mommyEnglishFav',JSON.stringify([...fav]));render()}
function daily(){let all=data.flatMap(d=>d.phrases);let day=Math.floor(Date.now()/86400000);return Array.from({length:5},(_,i)=>all[(day*7+i*37)%all.length])}
function filtered(){let p=view==='favorites'?data.flatMap(d=>d.phrases).filter(p=>fav.has(p.id)):view==='daily'?daily():data[category].phrases;return p.filter(p=>(p.en+' '+p.ko+' '+p.tip).toLowerCase().includes(query.toLowerCase()))}
function render(){let isAll=view==='all';$('cats').classList.toggle('hide',!isAll);$('cats').innerHTML=data.map(d=>`<button class="cat ${isAll&&category===d.id?'active':''}" data-cat="${d.id}"><span class="emoji">${d.emoji}</span><strong>${d.name}</strong><small>${d.label}</small></button>`).join('');$('heading').textContent=isAll?data[category].emoji+' '+data[category].name:view==='favorites'?'❤️ 즐겨찾기':'✨ 오늘의 5문장';$('flowTab').classList.toggle('hide',!isAll);$('phrasesTab').classList.toggle('active',tab==='phrases');$('flowTab').classList.toggle('active',tab==='flow');$('allNav').classList.toggle('active',isAll);$('favNav').classList.toggle('active',view==='favorites');$('dailyNav').classList.toggle('active',view==='daily');let list=filtered();$('count').textContent=tab==='flow'&&isAll?'대화 예시':list.length+'개 표현';if(tab==='flow'&&isAll){$('content').innerHTML=`<div class="note">엄마와 아이가 주고받는 짧은 대화예요. 문장을 눌러 소리 내어 들어 보세요.</div>`+data[category].flow.map(([role,en],i)=>`<div class="flowline"><div class="role">${role==='Mom'?'👩 엄마':'🧒 아이'}</div><div class="en">${escapeHtml(en)}</div><div class="actions"><button class="mini" data-say-flow="${i}">🔊 듣기</button></div></div>`).join('');}else{$('content').innerHTML=list.length?list.map(p=>`<div class="phrase"><div class="en">${escapeHtml(p.en)}</div><div class="ko">${escapeHtml(p.ko)}</div>${p.tip?`<div class="tip">💡 ${escapeHtml(p.tip)}</div>`:''}<div class="actions"><button class="mini" data-say="${p.id}">🔊 영어 듣기</button><button class="mini ${fav.has(p.id)?'saved':''}" data-save="${p.id}">${fav.has(p.id)?'♥ 저장됨':'♡ 즐겨찾기'}</button></div></div>`).join(''):'<div class="empty">표현이 없어요. 다른 검색어를 입력해 보세요.</div>'}}
function currentSentences(){return tab==='flow'&&view==='all'?data[category].flow.map(x=>x[1]):filtered().map(p=>p.en)}
async function playAll(){if(playing){playToken++;playing=false;speechSynthesis.cancel();$('playAll').textContent='▶ 순서대로 듣기';return}if(!('speechSynthesis' in window))return speak('Hello');let token=++playToken;playing=true;$('playAll').textContent='■ 재생 중지';let ss=currentSentences();for(let s of ss){if(token!==playToken)break;await new Promise(resolve=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang=$('accent').value;u.rate=Number($('rate').value);let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang===u.lang)||vs.find(v=>v.lang.startsWith('en'))||null;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)})}if(token===playToken){playing=false;$('playAll').textContent='▶ 순서대로 듣기'}}
$('cats').onclick=e=>{let b=e.target.closest('[data-cat]');if(b){category=+b.dataset.cat;tab='phrases';query='';$('search').value='';render()}};
$('content').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.say){let p=data.flatMap(d=>d.phrases).find(x=>x.id===b.dataset.say);if(p)speak(p.en)}if(b.dataset.save)save(b.dataset.save);if(b.dataset.sayFlow!==undefined)speak(data[category].flow[+b.dataset.sayFlow][1])};
$('search').oninput=e=>{query=e.target.value;render()};$('settingsBtn').onclick=()=>$('settings').classList.toggle('hide');$('testVoice').onclick=()=>speak('Hello, sweetheart! Let’s have a wonderful day!');$('phrasesTab').onclick=()=>{tab='phrases';render()};$('flowTab').onclick=()=>{tab='flow';render()};$('playAll').onclick=playAll;function nav(v){view=v;tab='phrases';query='';$('search').value='';render()}$('allNav').onclick=()=>nav('all');$('favNav').onclick=()=>nav('favorites');$('dailyNav').onclick=()=>nav('daily');render();
</script></body></html>
